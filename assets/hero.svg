<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">

  <title id="title">Md Fahim Imtiaz Khan</title>
  <desc id="desc">
    Animated indigo and cyan banner.
    Software Engineering, Applied AI, and Research.
  </desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080D1B"/>
      <stop offset=".55" stop-color="#171638">
        <animate attributeName="stop-color"
                 values="#171638;#10283B;#171638"
                 dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#67E8F9"/>
      <stop offset=".5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>

    <radialGradient id="glow">
      <stop stop-color="#818CF8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48"
             patternUnits="userSpaceOnUse">
      <path d="M 48 0 H 0 V 48"
            fill="none" stroke="#A5B4FC"
            stroke-opacity=".055"/>
    </pattern>

    <clipPath id="rounded">
      <rect width="1200" height="400" rx="24"/>
    </clipPath>

    <path id="orbitOne"
          d="M 930 200 m -145 0
             a 145 145 0 1 0 290 0
             a 145 145 0 1 0 -290 0"/>

    <path id="orbitTwo"
          d="M 930 200 m -105 0
             a 105 105 0 1 1 210 0
             a 105 105 0 1 1 -210 0"/>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1200" height="400" fill="url(#background)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>

    <!-- Soft moving light -->
    <circle cx="930" cy="200" r="280" fill="url(#glow)">
      <animate attributeName="r" values="260;310;260"
               dur="9s" repeatCount="indefinite"/>
    </circle>

    <circle cx="150" cy="380" r="220"
            fill="url(#glow)" opacity=".6">
      <animate attributeName="cx" values="150;270;150"
               dur="16s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbital geometry -->
    <g fill="none" stroke="#A5B4FC">
      <circle cx="930" cy="200" r="145" stroke-opacity=".14"/>
      <circle cx="930" cy="200" r="105" stroke-opacity=".20"/>
      <circle cx="930" cy="200" r="65" stroke-opacity=".12"/>

      <ellipse cx="930" cy="200" rx="175" ry="55"
               stroke-opacity=".16"
               transform="rotate(-35 930 200)"/>

      <ellipse cx="930" cy="200" rx="175" ry="55"
               stroke-opacity=".12"
               transform="rotate(35 930 200)"/>
    </g>

    <!-- Moving particles -->
    <circle r="5" fill="#67E8F9">
      <animateMotion dur="14s" repeatCount="indefinite">
        <mpath href="#orbitOne"/>
      </animateMotion>
    </circle>

    <circle r="4" fill="#C4B5FD">
      <animateMotion dur="10s" repeatCount="indefinite">
        <mpath href="#orbitTwo"/>
      </animateMotion>
    </circle>

    <!-- Breathing center -->
    <circle cx="930" cy="200" r="38"
            fill="#818CF8" fill-opacity=".08"
            stroke="#818CF8" stroke-opacity=".3">
      <animate attributeName="r" values="38;45;38"
               dur="5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity"
               values=".2;.55;.2"
               dur="5s" repeatCount="indefinite"/>
    </circle>

    <text x="930" y="210" text-anchor="middle"
          font-family="monospace" font-size="30"
          fill="#C4B5FD">&lt;/&gt;</text>

    <!-- Floating symbols -->
    <g font-family="monospace" fill="#A5B4FC">
      <text x="777" y="100" font-size="20" opacity=".4">{ }
        <animate attributeName="y" values="100;90;100"
                 dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="1070" y="300" font-size="24" opacity=".35">λ
        <animate attributeName="y" values="300;312;300"
                 dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="1075" y="105" font-size="18" opacity=".4">✦
        <animate attributeName="opacity" values=".2;.65;.2"
                 dur="4s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Identity -->
    <g font-family="Segoe UI, Arial, sans-serif">
      <rect x="65" y="72" width="245" height="31" rx="15.5"
            fill="#818CF8" fill-opacity=".1"
            stroke="#818CF8" stroke-opacity=".3"/>

      <circle cx="84" cy="87.5" r="4" fill="#67E8F9">
        <animate attributeName="opacity" values="1;.35;1"
                 dur="3s" repeatCount="indefinite"/>
      </circle>

      <text x="100" y="92" font-size="10"
            letter-spacing="1.8" fill="#C7D2FE">
        CURIOUS MIND · BUILDER
      </text>

      <text x="65" y="175" font-size="47"
            font-weight="700" letter-spacing="-1.4"
            fill="#F1F5F9">Md Fahim Imtiaz Khan</text>

      <text x="68" y="219" font-size="16"
            letter-spacing="2.2" fill="#A5B4FC">
        SOFTWARE ENGINEERING · APPLIED AI
      </text>

      <text x="68" y="264" font-size="17" fill="#94A3B8">
        Thoughtful software. Privacy-conscious intelligence.
      </text>

      <text x="68" y="335" font-size="12"
            letter-spacing="1.3" fill="#64748B">
        RESEARCH / MOBILE / BACKEND / HUMAN-CENTERED TOOLS
      </text>
    </g>

    <!-- Flowing underline -->
    <rect x="68" y="286" width="570" height="2"
          rx="1" fill="#818CF8" opacity=".13"/>

    <rect x="68" y="286" width="90" height="2"
          rx="1" fill="url(#accent)">
      <animate attributeName="x" values="68;548;68"
               dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;1;.4"
               dur="8s" repeatCount="indefinite"/>
    </rect>

    <rect y="397" width="1200" height="3"
          fill="url(#accent)" opacity=".7"/>
  </g>
</svg>
